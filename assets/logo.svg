<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
  </defs>
  <!-- macOS-style tile: 824px square with 100px margin -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <!-- orbit ring: one org among many -->
  <circle cx="512" cy="512" r="282" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="34"/>
  <circle cx="711" cy="313" r="30" fill="#ffffff" fill-opacity="0.85"/>
  <!-- navigation pointer: the pilot -->
  <g transform="rotate(45 512 512)">
    <path d="M512 262 L686 742 L512 640 L338 742 Z" fill="url(#shade)"/>
    <path d="M512 262 L512 640 L338 742 Z" fill="#ffffff"/>
  </g>
</svg>
